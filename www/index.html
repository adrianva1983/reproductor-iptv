<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap:; script-src 'self'; style-src 'self'; img-src * data: blob:; media-src * data: blob:; connect-src *; worker-src blob:">
    <title>Reproductor IPTV</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<section id="view-library" class="view">
    <header class="topbar">
        <h1>Canales</h1>
        <button id="btn-add-list" type="button">+ Lista</button>
    </header>

    <button id="btn-resume" type="button" class="resume" hidden></button>

    <div class="toolbar">
        <select id="playlist-select" aria-label="Lista activa"></select>
        <input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal" autocomplete="off">
    </div>

    <p id="library-status" class="status" role="status"></p>
    <div id="channel-list"></div>

    <footer class="list-actions">
        <button id="btn-refresh-list" type="button" hidden>Actualizar lista</button>
        <button id="btn-delete-list" type="button" class="danger" hidden>Eliminar lista</button>
    </footer>
</section>

<section id="view-add" class="view" hidden>
    <header class="topbar">
        <button id="btn-add-cancel" type="button">Cancelar</button>
        <h1>Nueva lista</h1>
        <span></span>
    </header>
    <form id="form-add" class="form">
        <label>Nombre
            <input id="add-name" type="text" required maxlength="60" autocomplete="off">
        </label>
        <fieldset>
            <legend>Origen</legend>
            <label class="inline"><input type="radio" name="source" value="url" checked> URL</label>
            <label class="inline"><input type="radio" name="source" value="text"> Pegar texto</label>
        </fieldset>
        <label id="field-url">URL de la lista
            <input id="add-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
        </label>
        <label id="field-text" hidden>Contenido M3U
            <textarea id="add-text" rows="10" spellcheck="false" autocomplete="off"></textarea>
        </label>
        <p id="add-error" class="error" role="alert"></p>
        <button id="btn-add-save" type="submit" class="primary">Guardar</button>
    </form>
</section>

<section id="view-player" class="view player" hidden>
    <video id="video" playsinline controls preload="auto"></video>

    <div id="player-overlay" class="overlay" hidden>
        <p id="player-message" role="alert"></p>
        <div class="overlay-actions">
            <button id="btn-retry" type="button" class="primary">Reintentar</button>
            <button id="btn-close-error" type="button">Volver</button>
        </div>
    </div>

    <div id="cast-banner" class="overlay" hidden>
        <p>Reproduciendo en <span id="cast-device-name"></span></p>
        <div class="overlay-actions">
            <button id="btn-cast-stop" type="button" class="primary">Dejar de enviar</button>
        </div>
    </div>

    <div id="tv-menu" class="overlay" hidden>
        <ul id="tv-menu-list"></ul>
        <div class="overlay-actions">
            <button id="btn-tv-menu-close" type="button">Cancelar</button>
        </div>
    </div>

    <div class="player-bar">
        <button id="btn-back" type="button">← Volver</button>
        <span id="player-title"></span>
        <button id="btn-send-tv" type="button" hidden aria-label="Enviar a TV">⇄TV</button>
        <button id="btn-fav-player" type="button" aria-pressed="false" aria-label="Favorito">☆</button>
        <button id="btn-fullscreen" type="button" aria-label="Pantalla completa">⛶</button>
    </div>
</section>

<script src="cordova.js"></script>
<script src="js/vendor/hls.min.js"></script>
<script src="js/vendor/mpegts.min.js"></script>
<script src="js/m3u.js"></script>
<script src="js/storage.js"></script>
<script src="js/player.js"></script>
<script src="js/index.js"></script>
</body>
</html>
